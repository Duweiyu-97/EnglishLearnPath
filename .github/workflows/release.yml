name: Build portable Windows package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: launcher/go.mod

      - name: Check static app
        shell: pwsh
        run: |
          node --check app/app.js
          node tests/static-smoke.mjs

      - name: Check launcher
        shell: pwsh
        run: |
          gofmt -w launcher/main.go
          git diff --exit-code
          Push-Location launcher
          go test ./...
          go vet ./...
          Pop-Location

      - name: Build portable package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.sha }}".Substring(0, 7) }
          ./build-portable.ps1 -Version $version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishLearnPath-Windows-x64
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -LiteralPath dist -Filter *.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $zip.FullName --title "EnglishLearnPath ${{ github.ref_name }}" --generate-notes
