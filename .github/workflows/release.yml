name: Build full offline packages

on:
  push:
    branches: [main, codex/macos-universal-support]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # build-whisper.ps1 uses the Visual Studio 17 2022 generator.
    # windows-latest can migrate to a newer VS major without that toolchain.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: launcher/go.mod

      - name: Check static app
        shell: pwsh
        run: |
          node --check app/app.js
          node --check app/whisper.js
          node tests/static-smoke.mjs
          node tests/macos-platform-smoke.mjs
          node tests/speaking-writing-regression.mjs

      - name: Check launcher
        shell: pwsh
        run: |
          Get-ChildItem launcher -Filter *.go | ForEach-Object { gofmt -w $_.FullName }
          git diff --exit-code
          Push-Location launcher
          go test ./...
          go vet ./...
          Pop-Location

      - name: Build portable package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.sha }}".Substring(0, 7) }
          ./build-portable.ps1 -Version $version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishLearnPath-Windows-x64-Full
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -LiteralPath dist -Filter *.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $zip.FullName --title "English Learning Path ${{ github.ref_name }} · 完整离线包" --notes-file docs/RELEASE_NOTES.md

  build-macos:
    name: Build macOS universal package
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: launcher/go.mod

      - name: Cache pinned Whisper downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/EnglishLearnPath-build
          key: english-learn-path-whisper-macos-371b5a7561823ab2bb32142d2751e35e7534727b-small-en

      - name: Check macOS launcher
        shell: bash
        run: |
          find launcher -name '*.go' -print0 | xargs -0 gofmt -w
          git diff --exit-code
          cd launcher
          go test ./...
          go vet ./...

      - name: Build universal macOS package
        shell: bash
        run: |
          chmod +x build-macos.sh build-whisper-macos.sh
          version="${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="$GITHUB_REF_NAME"; fi
          ./build-macos.sh "$version"

      - name: Verify packaged app starts and both architectures exist
        shell: bash
        run: |
          zip_path="$(find dist -maxdepth 1 -name 'EnglishLearnPath-macOS-Universal-Full-*.zip' -print -quit)"
          test -n "$zip_path"
          smoke_root="$RUNNER_TEMP/english-learn-path-macos-smoke"
          mkdir -p "$smoke_root"
          ditto -x -k "$zip_path" "$smoke_root"
          app_binary="$(find "$smoke_root" -path '*/English Learning Path.app/Contents/MacOS/EnglishLearnPath' -type f -print -quit)"
          whisper_binary="$(find "$smoke_root" -path '*/English Learning Path.app/Contents/Resources/whisper/whisper-cli' -type f -print -quit)"
          test -n "$app_binary"
          test -n "$whisper_binary"
          lipo -archs "$app_binary" | grep -q arm64
          lipo -archs "$app_binary" | grep -q x86_64
          lipo -archs "$whisper_binary" | grep -q arm64
          lipo -archs "$whisper_binary" | grep -q x86_64
          whisper_source_archive="$(dirname "$whisper_binary")/whisper.cpp-source.zip"
          whisper_source_root="$RUNNER_TEMP/english-learn-path-whisper-source"
          mkdir -p "$whisper_source_root"
          ditto -x -k "$whisper_source_archive" "$whisper_source_root"
          whisper_sample="$(find "$whisper_source_root" -path '*/samples/jfk.wav' -type f -print -quit)"
          test -n "$whisper_sample"
          (
            cd launcher
            ELP_WHISPER_BUNDLE="$(dirname "$whisper_binary")" ELP_WHISPER_TEST_WAV="$whisper_sample" go test -run TestBundledWhisperPublicSample -count=1
          )
          ENGLISH_LEARN_PATH_CONFIG_DIR="$RUNNER_TEMP/english-learn-path-config" "$app_binary" &
          app_pid=$!
          sleep 3
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishLearnPath-macOS-Universal-Full
          path: dist/EnglishLearnPath-macOS-Universal-Full-*.zip
          if-no-files-found: error

      - name: Add macOS package to GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_path="$(find dist -maxdepth 1 -name 'EnglishLearnPath-macOS-Universal-Full-*.zip' -print -quit)"
          gh release upload "$GITHUB_REF_NAME" "$zip_path" --clobber
